[package]
name = "personalization-setup"
version = "0.1.0"
description = "Personalization Setup for Claude Code hooks"
authors = ["Kushan Parikh"]
edition = "2021"

[lib]
# Distinct from the bin name (see tauri-apps/tauri#8519).
name = "personalization_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
